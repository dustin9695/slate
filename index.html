<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Digital Slate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f0e8;
    --cream: #ede8dc;
    --stripe-yellow: #f5c800;
    --stripe-black: #111111;
    --mid-gray: #2a2a2a;
    --light-gray: #888;
    --border: #333;
    --accent: #f5c800;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Courier Prime', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    overflow: hidden;
  }

  body {
    padding: clamp(8px, 2vw, 24px);
  }

  /* ── SLATE WRAPPER ── */
  .slate-wrapper {
    width: 100%;
    max-width: min(96vw, 900px);
    aspect-ratio: 4 / 3;
    background: var(--black);
    border: 3px solid var(--white);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 0 1px #000, 0 20px 80px rgba(0,0,0,.9);
    overflow: hidden;
  }

  /* Clapper sticks at top */
  .clapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .clapper-top {
    background: var(--white);
    height: clamp(20px, 5%, 38px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .clapper-stripes {
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--stripe-black) 0px,
      var(--stripe-black) 14px,
      var(--stripe-yellow) 14px,
      var(--stripe-yellow) 28px
    );
  }

  .clapper-hinge {
    width: 100%;
    height: clamp(6px, 1.5%, 12px);
    background: linear-gradient(to bottom, #444, #222, #444);
    border-top: 1px solid #666;
    border-bottom: 1px solid #111;
    position: relative;
    z-index: 2;
  }

  /* ── MAIN SLATE BODY ── */
  .slate-body {
    flex: 1;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 0;
  }

  /* ── TIMECODE BAR ── */
  .timecode-bar {
    background: var(--mid-gray);
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(4px, 1.2%, 10px) clamp(8px, 2%, 18px);
    gap: 8px;
  }

  .tc-label {
    font-family: var(--font-display);
    font-size: clamp(8px, 1.8vw, 14px);
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tc-display {
    font-family: var(--font-mono);
    font-size: clamp(16px, 4.5vw, 46px);
    color: var(--white);
    letter-spacing: 0.05em;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 2px 6px;
    transition: border-color 0.2s, background 0.2s;
    user-select: none;
  }

  .tc-display:hover, .tc-display.editing {
    border-color: var(--accent);
    background: rgba(245,200,0,0.08);
  }

  .tc-controls {
    display: flex;
    gap: clamp(4px, 1vw, 10px);
    flex-shrink: 0;
  }

  .tc-btn {
    font-family: var(--font-display);
    font-size: clamp(8px, 1.5vw, 12px);
    letter-spacing: 0.1em;
    color: var(--black);
    background: var(--accent);
    border: none;
    padding: clamp(3px, 0.8%, 7px) clamp(6px, 1.5%, 14px);
    cursor: pointer;
    text-transform: uppercase;
    font-weight: 700;
    border-radius: 2px;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .tc-btn:active { transform: scale(0.96); }
  .tc-btn.running { background: #e04040; color: var(--white); }

  /* ── CENTER FIELDS GRID ── */
  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    border-right: 1px solid var(--border);
    min-height: 0;
  }

  /* Big RST trio */
  .roll-scene-take {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    border-right: 2px solid var(--accent);
  }

  .rst-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--border);
    padding: clamp(4px, 1%, 12px) clamp(6px, 1.5%, 14px);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }

  .rst-item:last-child { border-bottom: none; }
  .rst-item:hover { background: rgba(255,255,255,0.03); }

  .rst-label {
    font-family: var(--font-display);
    font-size: clamp(7px, 1.6vw, 13px);
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .rst-value {
    font-family: var(--font-display);
    font-size: clamp(28px, 8vw, 72px);
    font-weight: 700;
    color: var(--white);
    line-height: 1;
    text-align: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Right side: production info */
  .info-fields {
    grid-column: 2 / 4;
    grid-row: 1 / 3;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 1fr);
  }

  .info-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(4px, 1.2%, 12px) clamp(8px, 2%, 16px);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    overflow: hidden;
  }

  .info-cell:hover { background: rgba(255,255,255,0.03); }
  .info-cell:nth-child(2n) { border-right: none; }
  .info-cell:nth-last-child(-n+2) { border-bottom: none; }

  .info-label {
    font-family: var(--font-display);
    font-size: clamp(6px, 1.4vw, 11px);
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 1px;
    white-space: nowrap;
  }

  .info-value {
    font-family: var(--font-body);
    font-size: clamp(11px, 2.4vw, 20px);
    color: var(--white);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-value.placeholder {
    color: var(--light-gray);
    font-weight: 400;
    font-style: italic;
  }

  /* ── BOTTOM BAR: date + fps ── */
  .bottom-bar {
    display: flex;
    align-items: stretch;
    border-top: 2px solid var(--accent);
    background: var(--mid-gray);
    flex-shrink: 0;
  }

  .bottom-cell {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(3px, 0.8%, 8px) clamp(6px, 1.5%, 14px);
    border-right: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }

  .bottom-cell:last-child { border-right: none; }
  .bottom-cell:hover { background: rgba(255,255,255,0.04); }

  .bottom-label {
    font-family: var(--font-display);
    font-size: clamp(6px, 1.3vw, 10px);
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .bottom-value {
    font-family: var(--font-mono);
    font-size: clamp(11px, 2.4vw, 20px);
    color: var(--white);
    font-weight: 700;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    padding: 16px;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: #1a1a1a;
    border: 2px solid var(--accent);
    width: 100%;
    max-width: 420px;
    padding: 24px;
    border-radius: 4px;
    transform: translateY(12px);
    transition: transform 0.2s;
    box-shadow: 0 30px 80px rgba(0,0,0,.9);
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-title {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .modal input, .modal select {
    width: 100%;
    background: #0f0f0f;
    border: 1px solid #444;
    color: var(--white);
    font-family: var(--font-body);
    font-size: 20px;
    padding: 10px 14px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }

  .modal input:focus, .modal select:focus { border-color: var(--accent); }

  .modal select option { background: #1a1a1a; }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn-cancel, .btn-save {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 22px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    font-weight: 700;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-cancel { background: #333; color: var(--light-gray); }
  .btn-save { background: var(--accent); color: var(--black); }
  .btn-cancel:hover { opacity: 0.8; }
  .btn-save:hover { opacity: 0.9; }
  .btn-save:active, .btn-cancel:active { transform: scale(0.97); }

  /* ── TC EDIT INPUT ── */
  .tc-input {
    font-family: var(--font-mono);
    font-size: clamp(16px, 4.5vw, 46px);
    color: var(--white);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    letter-spacing: 0.05em;
    caret-color: var(--accent);
    text-align: center;
  }

  /* ── FLASH ANIMATION ── */
  @keyframes flash {
    0%, 100% { background: transparent; }
    50% { background: rgba(245,200,0,0.12); }
  }

  .flashed { animation: flash 0.3s ease; }

  /* ── RESPONSIVE TWEAKS ── */

  /* Portrait phone */
  @media (max-aspect-ratio: 3/4) {
    .slate-wrapper {
      aspect-ratio: 3 / 4;
      max-width: min(98vw, 500px);
    }

    .fields-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
    }

    .roll-scene-take {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      flex-direction: row;
      border-right: none;
      border-bottom: 2px solid var(--accent);
    }

    .rst-item {
      border-bottom: none;
      border-right: 1px solid var(--border);
    }

    .rst-item:last-child { border-right: none; }

    .rst-value { font-size: clamp(22px, 9vw, 54px); }

    .info-fields {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
    }
  }

  /* Landscape phone */
  @media (max-height: 500px) {
    .clapper-top { height: clamp(14px, 4%, 24px); }
    .rst-value { font-size: clamp(18px, 5vw, 44px); }
  }
</style>
</head>
<body>

<div class="slate-wrapper" id="slate">

  <!-- CLAPPER TOP -->
  <div class="clapper">
    <div class="clapper-top">
      <div class="clapper-stripes"></div>
    </div>
    <div class="clapper-hinge"></div>
  </div>

  <!-- SLATE BODY -->
  <div class="slate-body">

    <!-- TIMECODE BAR -->
    <div class="timecode-bar">
      <span class="tc-label">TOD TC</span>
      <div class="tc-display" id="tcDisplay" onclick="openTcEdit()">00:00:00:00</div>
      <div class="tc-controls">
        <button class="tc-btn" id="tcBtn" onclick="toggleTC()">START</button>
        <button class="tc-btn" onclick="resetTC()" style="background:#333;color:#aaa;">RESET</button>
      </div>
    </div>

    <!-- FIELDS GRID -->
    <div class="fields-grid">

      <!-- ROLL / SCENE / TAKE -->
      <div class="roll-scene-take">
        <div class="rst-item" onclick="openModal('roll')">
          <div class="rst-label">Roll</div>
          <div class="rst-value" id="rollVal">A1</div>
        </div>
        <div class="rst-item" onclick="openModal('scene')">
          <div class="rst-label">Scene</div>
          <div class="rst-value" id="sceneVal">1</div>
        </div>
        <div class="rst-item" onclick="openModal('take')">
          <div class="rst-label">Take</div>
          <div class="rst-value" id="takeVal">1</div>
        </div>
      </div>

      <!-- INFO FIELDS -->
      <div class="info-fields">
        <div class="info-cell" onclick="openModal('production')">
          <div class="info-label">Production</div>
          <div class="info-value placeholder" id="productionVal">— tap to edit —</div>
        </div>
        <div class="info-cell" onclick="openModal('director')">
          <div class="info-label">Director</div>
          <div class="info-value placeholder" id="directorVal">— tap to edit —</div>
        </div>
        <div class="info-cell" onclick="openModal('dp')">
          <div class="info-label">D.P.</div>
          <div class="info-value placeholder" id="dpVal">— tap to edit —</div>
        </div>
        <div class="info-cell" onclick="openModal('camera')">
          <div class="info-label">Camera</div>
          <div class="info-value placeholder" id="cameraVal">A</div>
        </div>
        <div class="info-cell" onclick="openModal('day_night')">
          <div class="info-label">Day / Night</div>
          <div class="info-value" id="dayNightVal">DAY</div>
        </div>
        <div class="info-cell" onclick="openModal('int_ext')">
          <div class="info-label">INT / EXT</div>
          <div class="info-value" id="intExtVal">INT</div>
        </div>
        <div class="info-cell" onclick="openModal('notes')">
          <div class="info-label">Notes</div>
          <div class="info-value placeholder" id="notesVal">—</div>
        </div>
        <div class="info-cell" onclick="openModal('ep')">
          <div class="info-label">Episode</div>
          <div class="info-value placeholder" id="epVal">—</div>
        </div>
      </div>

    </div><!-- /fields-grid -->

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
      <div class="bottom-cell" onclick="openModal('date')">
        <div class="bottom-label">Date</div>
        <div class="bottom-value" id="dateVal" style="font-family:var(--font-body); font-size: clamp(10px, 2.2vw, 18px);"></div>
      </div>
      <div class="bottom-cell" onclick="openModal('fps')">
        <div class="bottom-label">Frame Rate</div>
        <div class="bottom-value" id="fpsVal">23.976</div>
      </div>
    </div>

  </div><!-- /slate-body -->
</div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Edit Field</div>
    <div id="modalInputContainer"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
const state = {
  roll: 'A1', scene: '1', take: '1',
  production: '', director: '', dp: '',
  camera: 'A', day_night: 'DAY', int_ext: 'INT',
  notes: '', ep: '',
  date: '', fps: '23.976'
};

const FIELDS = {
  roll:       { label: 'Roll', type: 'text', placeholder: 'e.g. A1' },
  scene:      { label: 'Scene', type: 'text', placeholder: 'e.g. 12A' },
  take:       { label: 'Take', type: 'number', placeholder: 'e.g. 3', min:1 },
  production: { label: 'Production', type: 'text', placeholder: 'Project title' },
  director:   { label: 'Director', type: 'text', placeholder: 'Director name' },
  dp:         { label: 'Director of Photography', type: 'text', placeholder: 'D.P. name' },
  camera:     { label: 'Camera', type: 'text', placeholder: 'e.g. A, B' },
  day_night:  { label: 'Day / Night', type: 'select', options: ['DAY','NIGHT'] },
  int_ext:    { label: 'INT / EXT', type: 'select', options: ['INT','EXT','INT/EXT','EXT/INT'] },
  notes:      { label: 'Notes', type: 'text', placeholder: 'MOS, VFX, SFX…' },
  ep:         { label: 'Episode', type: 'text', placeholder: 'e.g. 104' },
  date:       { label: 'Date', type: 'date' },
  fps:        { label: 'Frame Rate', type: 'select', options: ['23.976','24','25','29.97','30','47.95','48','50','59.94','60','119.88','120'] },
};

const PLACEHOLDERS = ['production','director','dp','notes','ep'];

// ── INIT DATE ──
(function initDate() {
  const d = new Date();
  const iso = d.toISOString().split('T')[0];
  state.date = iso;
  renderDate();
})();

function renderDate() {
  const d = state.date ? new Date(state.date + 'T12:00:00') : new Date();
  document.getElementById('dateVal').textContent =
    d.toLocaleDateString('en-US', { month:'short', day:'2-digit', year:'numeric' });
}

// ── RENDER ──
function render(key) {
  const ids = {
    roll:'rollVal', scene:'sceneVal', take:'takeVal',
    production:'productionVal', director:'directorVal', dp:'dpVal',
    camera:'cameraVal', day_night:'dayNightVal', int_ext:'intExtVal',
    notes:'notesVal', ep:'epVal', fps:'fpsVal'
  };
  if (key === 'date') { renderDate(); return; }
  const el = document.getElementById(ids[key]);
  if (!el) return;
  const val = state[key];
  if (PLACEHOLDERS.includes(key) || key === 'notes' || key === 'ep') {
    if (!val) {
      el.textContent = '—';
      el.classList.add('placeholder');
    } else {
      el.textContent = val;
      el.classList.remove('placeholder');
    }
  } else {
    el.textContent = val || '—';
    el.classList.remove('placeholder');
  }
  // flash
  el.classList.remove('flashed');
  void el.offsetWidth;
  el.classList.add('flashed');
}

// ── MODAL ──
let currentField = null;
let modalInput = null;

function openModal(key) {
  currentField = key;
  const cfg = FIELDS[key];
  document.getElementById('modalTitle').textContent = cfg.label;
  const container = document.getElementById('modalInputContainer');

  if (cfg.type === 'select') {
    const sel = document.createElement('select');
    cfg.options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (state[key] === opt) o.selected = true;
      sel.appendChild(o);
    });
    container.innerHTML = '';
    container.appendChild(sel);
    modalInput = sel;
  } else {
    const inp = document.createElement('input');
    inp.type = cfg.type === 'number' ? 'text' : (cfg.type || 'text');
    if (cfg.type === 'number') inp.inputMode = 'numeric';
    inp.value = state[key] || '';
    inp.placeholder = cfg.placeholder || '';
    if (cfg.min !== undefined) inp.min = cfg.min;
    container.innerHTML = '';
    container.appendChild(inp);
    modalInput = inp;
    setTimeout(() => inp.focus(), 80);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveModal(); });
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentField = null;
  modalInput = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveModal() {
  if (!currentField || !modalInput) { closeModal(); return; }
  let val = modalInput.value.trim();
  if (currentField === 'take') val = String(parseInt(val) || 1);
  state[currentField] = val;
  render(currentField);
  closeModal();
}

// ── TIMECODE ──
let tcRunning = false;
let tcFrames = 0;
let tcInterval = null;
let tcEditing = false;

function tcToStr(frames, fps) {
  const fpsr = Math.round(parseFloat(fps));
  const f  = frames % fpsr;
  const s  = Math.floor(frames / fpsr) % 60;
  const m  = Math.floor(frames / fpsr / 60) % 60;
  const h  = Math.floor(frames / fpsr / 3600) % 24;
  return [h,m,s,f].map(n => String(n).padStart(2,'0')).join(':');
}

function updateTCDisplay() {
  const el = document.getElementById('tcDisplay');
  if (!tcEditing) el.textContent = tcToStr(tcFrames, state.fps);
}

function toggleTC() {
  if (tcRunning) {
    clearInterval(tcInterval);
    tcRunning = false;
    document.getElementById('tcBtn').textContent = 'START';
    document.getElementById('tcBtn').classList.remove('running');
  } else {
    const fpsr = Math.round(parseFloat(state.fps));
    tcInterval = setInterval(() => {
      tcFrames++;
      updateTCDisplay();
    }, 1000 / fpsr);
    tcRunning = true;
    document.getElementById('tcBtn').textContent = 'STOP';
    document.getElementById('tcBtn').classList.add('running');
  }
}

function resetTC() {
  if (tcRunning) { clearInterval(tcInterval); tcRunning = false; }
  document.getElementById('tcBtn').textContent = 'START';
  document.getElementById('tcBtn').classList.remove('running');
  tcFrames = 0;
  updateTCDisplay();
}

// Tap to manually set TC
function openTcEdit() {
  if (tcRunning) return;
  const el = document.getElementById('tcDisplay');
  tcEditing = true;
  el.classList.add('editing');
  const inp = document.createElement('input');
  inp.className = 'tc-input';
  inp.value = tcToStr(tcFrames, state.fps);
  inp.maxLength = 11;
  el.textContent = '';
  el.appendChild(inp);
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') commitTcEdit(inp.value);
    if (e.key === 'Escape') cancelTcEdit();
  });
  inp.addEventListener('blur', () => commitTcEdit(inp.value));
}

function commitTcEdit(val) {
  const parts = val.split(':').map(Number);
  const fpsr = Math.round(parseFloat(state.fps));
  if (parts.length === 4) {
    const [h,m,s,f] = parts;
    tcFrames = ((h*3600 + m*60 + s) * fpsr) + f;
  }
  tcEditing = false;
  const el = document.getElementById('tcDisplay');
  el.classList.remove('editing');
  updateTCDisplay();
}

function cancelTcEdit() {
  tcEditing = false;
  const el = document.getElementById('tcDisplay');
  el.classList.remove('editing');
  updateTCDisplay();
}

// Sync FPS on change
const origSave = saveModal;
window.saveModal = function() {
  if (!currentField || !modalInput) { closeModal(); return; }
  let val = modalInput.value || (modalInput.options && modalInput.options[modalInput.selectedIndex].value);
  val = (val||'').trim();
  if (currentField === 'take') val = String(parseInt(val) || 1);
  state[currentField] = val;
  render(currentField);
  closeModal();
};

// ── PREVENT SLEEP (wake lock) ──
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { await navigator.wakeLock.request('screen'); } catch(e) {}
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
